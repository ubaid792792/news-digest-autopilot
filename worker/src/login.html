<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>News Digest</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --text:#eceef2; --muted:#9aa1ad; --line:#2a2f3a; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .mark { width:42px; height:42px; border-radius:11px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:800; font-size:16px; }
  h1 { font-size:18px; margin:0; } p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; }
  button { width:100%; margin-top:14px; padding:11px; border:0; border-radius:10px; background:#16181d; color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { background:var(--accent); color:#fff; } }
  .err { color:#dc2626; font-size:13px; min-height:20px; margin-top:10px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand"><div class="mark">ND</div><div><h1>News Digest</h1><p>Your daily news, sorted</p></div></div>
    <label for="pw">Login code</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
    <div class="err" id="err"></div>
  </form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/api/login', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.reload(); else err.textContent = (await r.json().catch(()=>({}))).error || 'Login failed';
});
</script>
</body>
</html>
